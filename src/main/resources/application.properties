spring.application.name=b2b-auth-service
server.port=${PORT:8081}

# ?? Base de données : H2 en mémoire (rien à installer, vidée à chaque redémarrage)
spring.datasource.url=jdbc:h2:mem:b2bauth;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.h2.console.enabled=true

# ?? JWT : secret lu depuis la variable d'environnement JWT_SECRET
#    (la valeur par défaut ne sert qu'au développement local, au moins 32 caractères)
security.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-at-least-32-chars}
security.jwt.issuer=b2b-auth-service
# Durée de validité du token en millisecondes (24 h)
security.jwt.expiration=86400000

# ?? Administrateur créé au démarrage (démo locale)
app.admin.email=${ADMIN_EMAIL:admin@b2b.local}
app.admin.password=${ADMIN_PASSWORD:admin12345}

# ?? Mails : désactivés par défaut (le token de réinitialisation s'affiche dans la console)
#    Pour envoyer de vrais mails : MAIL_ENABLED=true + MAIL_HOST, MAIL_USERNAME, MAIL_PASSWORD
app.mail.enabled=${MAIL_ENABLED:false}
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true